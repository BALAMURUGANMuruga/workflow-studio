<!-- Collect new account details and display registration feedback. -->

<section class="auth-page">
  <form class="auth-card" (ngSubmit)="submit()" #form="ngForm">

    <h1>Create an Operations account</h1>
    <p>Use this account to sign in to the Operations Portal.</p>

    <label for="username">Username</label>
    <input
      id="username"
      name="username"
      type="text"
      [(ngModel)]="username"
      required
      minlength="3"
      maxlength="80"
      autocomplete="username"
      placeholder="Choose a username"
    />

    <label for="email">Email</label>
    <input
      id="email"
      name="email"
      type="email"
      [(ngModel)]="email"
      required
      email
      autocomplete="email"
      placeholder="Enter your email"
    />

    <label for="password">Password (minimum 8 characters)</label>
    <input
      id="password"
      name="password"
      type="password"
      [(ngModel)]="password"
      required
      minlength="8"
      maxlength="15"
      autocomplete="new-password"
      placeholder="Create a password"
    />

    <label for="confirmPassword">Confirm password</label>
    <input
      id="confirmPassword"
      name="confirmPassword"
      type="password"
      [(ngModel)]="confirmPassword"
      required
      maxlength="15"
      autocomplete="new-password"
      placeholder="Confirm your password"
    />

    @if (errorMessage) {
      <p role="alert" class="error-message">
        {{ errorMessage }}
      </p>
    }

    @if (successMessage) {
      <p role="status" class="success-message">
        {{ successMessage }}
      </p>
    }

    <button type="submit" [disabled]="form.invalid || loading">
      {{ loading ? 'Creating account...' : 'Create account' }}
    </button>

    @if (!inDialog()) {
      <a routerLink="/login" [queryParams]="{ account: 'operations' }">Already have an account? Sign in</a>
    }

  </form>
</section>
