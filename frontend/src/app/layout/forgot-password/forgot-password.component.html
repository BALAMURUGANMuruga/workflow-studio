<!-- Switch the visible form between requesting a code and submitting a password reset. -->
<section class="auth-page">
  <div class="auth-card">

    @if (!otpRequested) {
      <h1>Forgot password?</h1>
      <p>We'll email a six-digit reset code if the account exists.</p>

      <form (ngSubmit)="requestOtp()" #emailForm="ngForm">
        <label for="email">Email address</label>

        <input
          id="email"
          name="email"
          type="email"
          [(ngModel)]="email"
          required
          email
          autocomplete="email"
          placeholder="Enter your registered email"
        />

        <button
          type="submit"
          [disabled]="emailForm.invalid || loading">
          {{ loading ? 'Sending...' : 'Send OTP' }}
        </button>
      </form>
    } @else {
      <h1>Reset password</h1>
      <p>Enter the six-digit code sent to your email.</p>

      <form (ngSubmit)="resetPassword()" #resetForm="ngForm">
        <label for="emailReadOnly">Email address</label>

        <input
          id="emailReadOnly"
          name="emailReadOnly"
          type="email"
          [value]="email"
          readonly
        />

        <label for="otp">Six-digit email code</label>

        <input
          id="otp"
          name="otp"
          type="text"
          [(ngModel)]="otp"
          required
          pattern="[0-9]{6}"
          inputmode="numeric"
          autocomplete="one-time-code"
          maxlength="6"
          placeholder="Enter OTP"
        />

        <label for="newPassword">
          New password (minimum 12 characters)
        </label>

        <input
          id="newPassword"
          name="newPassword"
          type="password"
          [(ngModel)]="newPassword"
          required
          minlength="12"
          maxlength="128"
          autocomplete="new-password"
          placeholder="Enter new password"
        />

        <label for="confirmPassword">Confirm new password</label>

        <input
          id="confirmPassword"
          name="confirmPassword"
          type="password"
          [(ngModel)]="confirmPassword"
          required
          maxlength="128"
          autocomplete="new-password"
          placeholder="Confirm new password"
        />

        <button
          type="submit"
          [disabled]="resetForm.invalid || loading">
          {{ loading ? 'Resetting...' : 'Reset password' }}
        </button>

        <button
          type="button"
          class="secondary-button"
          (click)="requestAnotherCode()"
          [disabled]="loading">
          Request another code
        </button>
      </form>
    }

    @if (errorMessage) {
      <p role="alert" class="error-message">
        {{ errorMessage }}
      </p>
    }

    @if (successMessage) {
      <p role="status" class="success-message">
        {{ successMessage }}
      </p>
    }

    <a routerLink="/login" [queryParams]="{ account: 'operations' }">Back to sign in</a>

  </div>
</section>
