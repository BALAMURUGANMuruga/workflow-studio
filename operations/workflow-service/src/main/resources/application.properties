server.port=8081


ai.service.base-url=${WORKFLOW_STUDIO_API_URL:http://127.0.0.1:8000}

# Supabase PostgreSQL
spring.datasource.url=${WORKFLOW_DB_URL}
spring.datasource.username=${WORKFLOW_DB_USERNAME}
spring.datasource.password=${WORKFLOW_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true


oms.interop.url=${OMS_INTEROP_URL}
oms.interop.user=${OMS_INTEROP_USER}
oms.interop.password=${OMS_INTEROP_PASSWORD}
server.address=127.0.0.1
