services:
  - name: workflow-studio-api
    type: pserv
    runtime: docker
    plan: 1c-2g
    rootDir: backend
    envVars:
      - key: PORT
        value: "8000"
      - key: WORKFLOW_REQUIRE_CONFIGURED_AUTH
        value: "true"
      - key: WORKFLOW_AUTH_SECRET
        generateValue: true
      - key: WORKFLOW_ADMIN_USERNAME
        sync: false
      - key: WORKFLOW_ADMIN_PASSWORD
        sync: false
      - key: WORKFLOW_MOCK_MODE
        value: "false"
  - name: workflow-studio-web
    type: web
    runtime: docker
    plan: 0.5c-512mb
    rootDir: frontend
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: "10000"
      - key: API_UPSTREAM
        fromService:
          name: workflow-studio-api
          type: pserv
          property: hostport
