services:
  - name: workflow-studio-web
    type: web
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile.render
    healthCheckPath: /api/health
    envVars:
      - key: WORKFLOW_REQUIRE_CONFIGURED_AUTH
        value: "true"
      - key: WORKFLOW_AUTH_SECRET
        generateValue: true
      - key: WORKFLOW_ADMIN_USERNAME
        sync: false
      - key: WORKFLOW_ADMIN_PASSWORD
        sync: false
      - key: WORKFLOW_MOCK_MODE
        value: "false"
      - key: LOCAL_AI_TRAIN_EPOCHS
        value: "3"
